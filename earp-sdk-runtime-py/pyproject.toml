[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earp-sdk-runtime"
version = "0.1.0.dev0"
description = "EARP Runtime SDK — invoke Capabilities, manage Sessions, subscribe to events"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "EARP Team" }]

dependencies = [
    "earp-sdk-core>=0.1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
dev = [
    "earp-sdk-runtime[test]",
]

[tool.hatch.build.targets.wheel]
packages = ["src/earp_sdk_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
