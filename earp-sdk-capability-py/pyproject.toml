[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earp-sdk-capability"
version = "0.1.0.dev0"
description = "EARP Capability SDK — develop, test, and register Capabilities"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "EARP Team" }]

dependencies = [
    "earp-sdk-core>=0.1.0",
    "pydantic>=2.0",
    "httpx>=0.27",
    "rich>=13.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]
dev = [
    "earp-sdk-capability[test]",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
earp = "earp_sdk_capability.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/earp_sdk_capability"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
