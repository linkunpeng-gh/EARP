name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sdk: [earp-sdk-core-py, earp-sdk-connector-py, earp-sdk-runtime-py, earp-sdk-plugin-py, earp-sdk-capability-py]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio httpx cryptography
          pip install -e libs/earp-sdk-core-py
          pip install -e libs/earp-sdk-connector-py
          pip install -e libs/earp-sdk-runtime-py
          pip install -e libs/earp-sdk-plugin-py

      - name: Run tests (${{ matrix.sdk }})
        run: |
          python -m pytest libs/${{ matrix.sdk }}/tests/ -v --tb=short

  test-all:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install all SDKs
        run: |
          pip install pytest pytest-asyncio httpx cryptography
          pip install -e libs/earp-sdk-core-py
          pip install -e libs/earp-sdk-connector-py
          pip install -e libs/earp-sdk-runtime-py
          pip install -e libs/earp-sdk-plugin-py
      - name: Run full test suite
        run: |
          python -m pytest libs/earp-sdk-core-py/tests/ libs/earp-sdk-connector-py/tests/ libs/earp-sdk-runtime-py/tests/ libs/earp-sdk-plugin-py/tests/ -v --tb=short

  validate-refs:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cross-reference validation
        run: python3 scripts/validate-cross-refs.py

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/earp-server
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Sync dependencies
        run: uv sync

      - name: Lint (ruff + format + pyright + import-linter)
        run: |
          uv run ruff check src tests spikes
          uv run ruff format --check src tests spikes
          uv run pyright
          uv run lint-imports

      - name: Migration SQL lint (squawk)
        run: |
          uv run alembic upgrade head --sql > /tmp/earp-migration.sql
          npx --yes squawk-cli@2 --exclude=prefer-text-field,prefer-bigint-over-int,prefer-identity,require-concurrent-index-creation /tmp/earp-migration.sql

      - name: Tests (testcontainers PG16 + pgvector)
        run: uv run pytest -q

      - name: OpenAPI baseline drift check
        run: |
          uv run python -m earp_server.export_openapi > /tmp/openapi-generated.yaml
          diff -u openapi.yaml /tmp/openapi-generated.yaml

      - name: ADR-007 presence check (AC-09)
        working-directory: ${{ github.workspace }}
        run: |
          test -f arch/design/ADR-007-modular-monolith.md
          grep -q "spike 结论" arch/design/ADR-007-modular-monolith.md
