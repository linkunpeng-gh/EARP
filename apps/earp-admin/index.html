<script>
// ── 首页：实时统计（API 不可用时回退示例值）──
(function () {
  var DEMO = { kbs: 2, dds: 4, caps: 2, models: 1, sessions: 0 };

  function badge(text) {
    document.getElementById('data-badge').textContent = text;
  }

  function setStat(id, v) {
    var el = document.getElementById(id);
    if (el) el.textContent = v;
  }

  async function loadLive() {
    try {
      var [kbs, dds, caps, models, sess] = await Promise.all([
        EARP.fetchJSON('/knowledge/bases').then(function (r) { return r.length; }).catch(function () { return DEMO.kbs; }),
        EARP.fetchJSON('/api/data-domains').then(function (r) { return r.length; }).catch(function () { return DEMO.dds; }),
        EARP.fetchJSON('/capabilities').then(function (r) { return r.length; }).catch(function () { return DEMO.caps; }),
        EARP.fetchJSON('/api/model-configs').then(function (r) { return r.length; }).catch(function () { return DEMO.models; }),
        EARP.fetchJSON('/v1/sessions?page=1&page_size=1').then(function (r) { return r; }).catch(function () { return { total: DEMO.sessions }; }),
      ]);
      badge('● 实时数据');
      setStat('stat-kbs', kbs); setStat('stat-dds', dds); setStat('stat-caps', caps);
      setStat('stat-models', models); setStat('stat-sessions', sess.total);
    } catch (e) {
      badge('离线 · 示例数据（未连接后端）');
      setStat('stat-kbs', DEMO.kbs); setStat('stat-dds', DEMO.dds);
      setStat('stat-caps', DEMO.caps); setStat('stat-models', DEMO.models);
      setStat('stat-sessions', DEMO.sessions);
    }
  }

  document.addEventListener('DOMContentLoaded', loadLive);
})();
</script>
