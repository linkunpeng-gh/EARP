<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><title>Login — EARP</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
<link rel="stylesheet" href="../css/admin.css"></head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh">
<div style="width:360px;padding:2rem;border:1px solid var(--border);border-radius:8px">
<h2 style="text-align:center">⚡ EARP Admin</h2>
<form>
  <label>Tenant ID <input type="text" placeholder="tenant-demo" value="tenant-demo"></label>
  <label>User ID <input type="text" placeholder="u1" value="u1"></label>
  <label>Role ID <input type="text" placeholder="r1" value="r1"></label>
  <button type="submit" style="width:100%">Login</button>
</form>
<p style="text-align:center;font-size:0.8rem;opacity:0.5;margin-top:1rem">dev mode: EARP_AUTH_STRATEGY=dev-skip</p>
</div>
</body></html>
