<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="EARP 应用中心"><title>应用中心 — EARP</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"><link rel="stylesheet" href="../css/admin.css">
<style>
.app-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; }
.app-card {
  display: flex; flex-direction: column; gap: 0.5rem;
  padding: 1.1rem 1.2rem; background: var(--bg-panel);
  border: 1px solid var(--border-subtle); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-card); text-decoration: none; color: inherit;
}
.app-card .ac-top { display: flex; align-items: center; gap: 0.5rem; }
.app-card .ac-name { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); flex: 1; }
.app-card .ac-desc { font-size: 0.78rem; color: var(--text-tertiary); line-height: 1.5; }
.app-card .ac-meta { font-size: 0.72rem; color: var(--text-quaternary); }
</style>
</head>
<body data-base=".." data-section="apps" data-sub="overview">
<header id="app-header"></header>
<main>
<div class="page-title"><div><h2>应用中心</h2><p class="page-subtitle">已发布应用（chat 智能体）— 最终使用界面二期开放；发布管理见「工作台 → chat」</p></div></div>
<div class="app-grid" id="app-grid">
  <p class="kb-empty" id="loading">加载中…</p>
</div>
</main>
<script src="../js/app.js"></script>
<script src="../js/nav.js"></script>
<script>
document.addEventListener('DOMContentLoaded', loadApps);

async function loadApps() {
  try {
    var apps = await EARP.fetchJSON('/chat_apps');
    var published = apps.filter(function (a) { return a.status === 'published'; });
    var grid = document.getElementById('app-grid');
    if (!published.length) {
      grid.innerHTML = '<div class="app-grid" style="grid-column:1/-1"><p class="kb-empty">暂无已发布应用 — 请先在「工作台 → chat」创建并发布。</p></div>';
      return;
    }
    grid.innerHTML = published.map(function (a) {
      return '<div class="app-card">'
        + '<div class="ac-top"><span class="ac-name">' + esc(a.name) + '</span><span class="tag tag-green">已发布</span></div>'
        + '<div class="ac-desc">' + esc(a.description || '暂无描述') + '</div>'
        + '<div class="ac-meta">使用界面二期开放</div>'
        + '</div>';
    }).join('');
  } catch (err) {
    document.getElementById('app-grid').innerHTML = '<p class="kb-empty">加载失败: ' + esc(err.message) + '</p>';
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
</script>
</body></html>
