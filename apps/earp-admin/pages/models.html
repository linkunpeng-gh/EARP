<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="EARP Model Config"><title>模型配置 — EARP</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"><link rel="stylesheet" href="../css/admin.css"></head>
<body data-base=".." data-section="capability" data-sub="models">
<header id="app-header"></header>
<main>
<div class="page-title"><div><h2>模型配置</h2><p class="page-subtitle">Model providers · 默认模型 · 凭证管理（PRD-2026-031）</p></div>
  <button class="ai-trigger" onclick="EARPCopilot.toggle()">✨ AI 助手</button></div>

<!-- 默认模型设置 -->
<div class="section-card" style="margin-bottom:16px">
  <div class="section-header"><h4 style="margin:0;font-size:0.87rem">默认模型</h4>
    <button class="btn-sm primary" onclick="saveDefaults()">保存默认</button></div>
  <div class="form-row"><label>推理模型 (LLM)</label>
    <select id="def-llm" style="flex:1"><option value="">— 使用环境变量默认 —</option></select>
    <button class="btn-sm" onclick="testDefault('llm')">测试</button></div>
  <div class="form-row"><label>嵌入模型 (Embedding)</label>
    <select id="def-embedding" style="flex:1"><option value="">— 使用环境变量默认 —</option></select>
    <button class="btn-sm" onclick="testDefault('embedding')">测试</button></div>
  <div class="form-row"><label>重排序 (Rerank)</label>
    <select id="def-rerank" style="flex:1"><option value="">— 未配置（Phase 2）—</option></select>
    <button class="btn-sm" onclick="testDefault('rerank')">测试</button></div>
  <div class="form-row"><label>Copilot 配置助手</label>
    <select id="def-copilot" style="flex:1"><option value="">— 使用默认模型 —</option></select>
    <button class="btn-sm" onclick="testDefault('copilot')">测试</button>
    <span style="font-size:0.72rem;color:var(--text-tertiary,#8b8d91);margin-left:8px">AI 助手专用模型</span></div>
  <div class="form-row" style="align-items:flex-start"><label style="padding-top:4px">QU 升级模板</label>
    <div style="flex:1">
      <textarea id="def-qu-tpl" rows="4" placeholder="留空=使用内置默认；或点「载入默认」以默认内容为底稿修改。占位符：{query} {missing} {relation_candidates} {context}。需先配置默认 LLM。" style="width:100%;font-size:0.76rem;font-family:ui-monospace,Menlo,monospace"></textarea>
      <div style="margin-top:4px"><button class="btn-sm" onclick="loadDefaultTpl()">载入默认</button>
        <span style="font-size:0.72rem;color:var(--text-tertiary,#8b8d91)">以内置默认内容为底稿修改；保存内容=默认等价于留空</span></div>
    </div></div>
  <p id="default-msg" style="font-size:0.78rem;color:var(--text-tertiary,#8b8d91);margin:8px 0 0"></p>
</div>

<!-- 模型配置列表 -->
<div class="section-card">
  <div class="section-header"><h4 style="margin:0;font-size:0.87rem">模型配置 <span id="cfg-count" style="font-weight:400;color:var(--text-tertiary)"></span></h4>
    <button class="btn-sm primary" onclick="showAddModal()">+ 添加模型</button></div>
  <table><thead><tr><th>Provider</th><th>Type</th><th>Model</th><th>凭证</th><th>状态</th><th>操作</th></tr></thead>
  <tbody id="cfg-tbody"><tr><td colspan="6" style="text-align:center;color:var(--text-tertiary,#8b8d91);padding:2rem">Loading...</td></tr></tbody></table>
</div>

<!-- 添加模型模态框 -->
<div id="add-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)hideAddModal()">
  <div class="modal">
    <h4>添加模型</h4>
    <div class="form-row"><label>Provider</label>
      <select id="add-provider" style="flex:1" onchange="onProviderChange()"></select></div>
    <div class="form-row"><label>Type</label>
      <select id="add-type" style="flex:1"><option value="llm">LLM 推理</option><option value="embedding">Embedding 嵌入</option><option value="rerank">Rerank（Phase 2）</option></select></div>
    <div class="form-row"><label>Model Name</label><input id="add-name" placeholder="qwen3.6:35b / bge-m3:latest / gpt-4o" style="flex:1"></div>
    <div id="cred-fields"></div>
    <div class="form-actions">
      <button class="primary" onclick="saveModel()">保存</button>
      <button class="btn-sm" onclick="hideAddModal()">取消</button></div>
  </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/copilot.js"></script>
<script>
// ── State (PRD-2026-031) ──
var state = { providers: [], configs: [], defaults: {} };
var typeLabels = { llm: 'LLM', embedding: 'Embedding', rerank: 'Rerank' };

document.addEventListener('DOMContentLoaded', init);

async function init() {
  try {
    state.providers = await EARP.fetchJSON('/api/model-providers');
    state.configs = await EARP.fetchJSON('/api/model-configs');
    state.defaults = await EARP.fetchJSON('/api/system-model-settings');
  } catch (e) { alert('加载失败: ' + e.message); }
  renderDefaults();
  renderConfigs();
}

var defaultEmptyLabels = {
  llm: '— 使用环境变量默认 —',
  embedding: '— 使用环境变量默认 —',
  rerank: '— 未配置（Phase 2）—',
  copilot: '— 使用默认模型 —'
};

function fillSelect(id, items, selected, emptyLabel) {
  var sel = document.getElementById(id);
  var html = '<option value="">' + (emptyLabel || '— 未配置 —') + '</option>';
  html += items.map(function(it) {
    var s = it.value === selected ? ' selected' : '';
    return '<option value="' + it.value + '"' + s + '>' + it.label + '</option>';
  }).join('');
  sel.innerHTML = html;
  if (!selected) sel.value = '';
}

function renderDefaults() {
  ['llm', 'embedding', 'rerank', 'copilot'].forEach(function(t) {
    var items = state.configs.filter(function(c) { return c.model_type === t || (t === 'copilot' && c.model_type === 'llm'); })
      .map(function(c) { return { value: c.config_id, label: c.provider + ' · ' + c.model_name }; });
    var cur = state.defaults[t] ? state.defaults[t].model_config_id : '';
    fillSelect('def-' + t, items, cur, defaultEmptyLabels[t]);
  });
  var tplEl = document.getElementById('def-qu-tpl');
  if (tplEl) tplEl.value = state.defaults.qu_prompt_template || '';
}
function loadDefaultTpl() {
  var tplEl = document.getElementById('def-qu-tpl');
  if (tplEl && state.defaults.default_qu_prompt) tplEl.value = state.defaults.default_qu_prompt;
}

async function saveDefaults() {
  var body = {};
  ['llm', 'embedding', 'rerank', 'copilot'].forEach(function(t) {
    var v = document.getElementById('def-' + t).value;
    if (v) body[t] = v;
  });
  var tplEl = document.getElementById('def-qu-tpl');
  if (tplEl) {
    var newVal = tplEl.value;
    if (newVal === (state.defaults.default_qu_prompt || '')) newVal = '';  // =默认文本 → 存空（保持默认行为）
    if (newVal !== (state.defaults.qu_prompt_template || '')) {
      body.qu_prompt_template = newVal;  // 改动才提交（空串=清除/默认）
    }
  }
  try {
    var res = await EARP.fetchJSON('/api/system-model-settings', { method: 'PUT', body: JSON.stringify(body) });
    state.defaults.qu_prompt_template = res.qu_prompt_template;
    document.getElementById('default-msg').textContent = '✅ 保存成功';
  } catch (e) { document.getElementById('default-msg').textContent = '保存失败: ' + e.message; }
}

async function testDefault(t) {
  var v = document.getElementById('def-' + t).value;
  if (!v) { alert('先选择模型'); return; }
  var res = await EARP.fetchJSON('/api/model-configs/' + v + '/test', { method: 'POST' });
  alert((res.ok ? '✅ ' : '❌ ') + res.detail);
}

function renderConfigs() {
  var tbody = document.getElementById('cfg-tbody');
  document.getElementById('cfg-count').textContent = '(' + state.configs.length + ')';
  if (state.configs.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:var(--text-tertiary,#8b8d91);padding:2rem">无模型配置 — 使用环境变量默认。点击「+ 添加模型」配置。</td></tr>';
    return;
  }
  tbody.innerHTML = state.configs.map(function(c) {
    var isDef = state.defaults[c.model_type] && state.defaults[c.model_type].model_config_id === c.config_id;
    return '<tr>'
      + '<td>' + esc(c.provider) + '</td>'
      + '<td>' + esc(typeLabels[c.model_type] || c.model_type) + '</td>'
      + '<td><code>' + esc(c.model_name) + '</code></td>'
      + '<td><span class="tag tag-internal">已加密</span></td>'
      + '<td>' + (isDef ? '<span class="tag tag-accent">默认</span>' : (c.enabled ? '✅' : '⏸')) + '</td>'
      + '<td><button class="btn-sm" type="button" data-mc-action="test" data-mc-id="' + esc(c.config_id) + '">测试</button> '
      + '<button class="btn-sm" type="button" data-mc-action="del" data-mc-id="' + esc(c.config_id) + '">🗑</button></td>'
      + '</tr>';
  }).join('');
}

async function testConfig(id) {
  var res = await EARP.fetchJSON('/api/model-configs/' + id + '/test', { method: 'POST' });
  alert((res.ok ? '✅ ' : '❌ ') + res.detail);
}

async function deleteConfig(id) {
  if (!confirm('删除该模型配置？')) return;
  try {
    await EARP.fetchJSON('/api/model-configs/' + id, { method: 'DELETE' });
    state.configs = await EARP.fetchJSON('/api/model-configs');
    renderConfigs(); renderDefaults();
  } catch (e) { alert('删除失败: ' + e.message); }
}

// ── Add model ──
function showAddModal() {
  var sel = document.getElementById('add-provider');
  sel.innerHTML = state.providers.map(function(p) {
    return '<option value="' + esc(p.provider) + '">' + esc(p.name) + ' (' + esc(p.provider) + ')</option>';
  }).join('');
  document.getElementById('add-type').value = 'llm';
  document.getElementById('add-name').value = '';
  onProviderChange();
  document.getElementById('add-modal').style.display = 'flex';
}
function hideAddModal() { document.getElementById('add-modal').style.display = 'none'; }

function onProviderChange() {
  var prov = document.getElementById('add-provider').value;
  var p = state.providers.find(function(x) { return x.provider === prov; });
  if (!p) return;
  var type = document.getElementById('add-type').value;
  document.getElementById('add-name').placeholder = (p.default_models && p.default_models[type]) || 'model name';
  var wrap = document.getElementById('cred-fields');
  wrap.innerHTML = (p.credential_schema || []).map(function(f) {
    var def = f.default ? ' value="' + f.default + '"' : '';
    return '<div class="form-row"><label>' + f.key + '</label>'
      + '<input id="cred-' + f.key + '" placeholder="' + (f.required ? 'required' : 'optional') + '"' + def + ' style="flex:1"'
      + (f.type === 'secret' ? ' type="password"' : '') + '></div>';
  }).join('');
}

async function saveModel() {
  var provider = document.getElementById('add-provider').value;
  var type = document.getElementById('add-type').value;
  var name = document.getElementById('add-name').value.trim();
  if (!name) { alert('Model name required'); return; }
  var p = state.providers.find(function(x) { return x.provider === provider; });
  var creds = {};
  (p.credential_schema || []).forEach(function(f) {
    var el = document.getElementById('cred-' + f.key);
    if (el && el.value) creds[f.key] = el.value;
  });
  try {
    await EARP.fetchJSON('/api/model-configs', {
      method: 'POST',
      body: JSON.stringify({ provider: provider, model_type: type, model_name: name, credentials: creds }),
    });
    hideAddModal();
    state.configs = await EARP.fetchJSON('/api/model-configs');
    renderConfigs(); renderDefaults();
  } catch (e) { alert('保存失败: ' + e.message); }
}

// ── Copilot init ──
document.addEventListener('DOMContentLoaded', function() {
  EARPCopilot.init({
    pageId: 'models',
    getFormState: function() {
      return {
        default_llm: document.getElementById('def-llm').value,
        default_embedding: document.getElementById('def-embedding').value,
        default_rerank: document.getElementById('def-rerank').value,
        qu_prompt_template: document.getElementById('def-qu-tpl').value,
        configs: state.configs.map(function(c) {
          return { provider: c.provider, model_type: c.model_type, model_name: c.model_name, enabled: c.enabled };
        }),
      };
    },
  });
});

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// 行内动作委托（安全修复）：config_id 为用户可控自由文本（此前裸拼进 inline onclick
// 的 JS 字符串字面量）。值经 esc() 进入 HTML 属性（单上下文）后由 dataset 读取。
document.addEventListener('click', function (e) {
  var el = e.target && e.target.closest ? e.target.closest('[data-mc-action]') : null;
  if (!el) return;
  var id = el.getAttribute('data-mc-id') || '';
  if (el.getAttribute('data-mc-action') === 'test') testConfig(id);
  else if (el.getAttribute('data-mc-action') === 'del') deleteConfig(id);
});
</script>
</main></body></html>
