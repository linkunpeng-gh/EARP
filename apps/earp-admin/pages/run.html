<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="EARP 智能体运行"><title>运行 — EARP</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"><link rel="stylesheet" href="../css/admin.css">
</head>
<body data-base=".." data-section="apps" data-sub="overview">
<header id="app-header"></header>
<main>
<div class="page-title">
  <div><h2 id="rp-name">—</h2><p class="page-subtitle" id="rp-sub"></p></div>
  <div style="display:flex;gap:0.5rem;">
    <button class="btn-sm btn-outline" id="rp-fav">☆ 收藏</button>
    <a class="btn-sm btn-outline" href="apps.html" style="text-decoration:none;">← 返回智能体列表</a>
  </div>
</div>

<div class="run-page">
  <div class="run-side">
    <div class="form-section-title">会话历史</div>
    <div id="conv-list" style="display:flex;flex-direction:column;gap:0.4rem;overflow-y:auto;flex:1;"></div>
    <button class="btn-sm" id="rp-new">+ 新建会话</button>
  </div>
  <div class="run-main">
    <div class="rm-msgs" id="rm-msgs"></div>
    <div id="rp-ha" class="ha-bar" style="display:none;margin:0 1rem 0.5rem;"></div>
    <div class="rm-input">
      <textarea id="rm-input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="primary" id="rm-send">发送</button>
    </div>
  </div>
</div>
</main>
<script src="../js/app.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/run.js"></script>
</body></html>
