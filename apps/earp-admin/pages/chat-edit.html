<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="EARP Chat 智能体编排"><title>编排 — EARP</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"><link rel="stylesheet" href="../css/admin.css">
<style>
/* 编排页布局：左配置 / 右调试预览 */
.edit-layout { display: grid; grid-template-columns: 320px 1fr; gap: 1.25rem; align-items: start; }
@media (max-width: 960px) { .edit-layout { grid-template-columns: 1fr; } }
.edit-top { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 1.25rem; flex-wrap: wrap; }
.edit-top h2 { margin: 0; font-size: 1.25rem; }
.edit-top .spacer { flex: 1; }
.config-panel { background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); padding: 1.1rem; box-shadow: var(--shadow-card); }
.config-panel .cfg-label { display: block; font-size: 0.78rem; font-weight: 500; color: var(--text-secondary); margin-bottom: 0.3rem; }
/* 参数帮助小 tip（hover 查看） */
.cfg-tip {
  display: inline-flex; align-items: center; justify-content: center;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--bg-surface); border: 1px solid var(--border-standard);
  color: var(--text-quaternary); font-size: 0.62rem; cursor: help;
  position: relative; flex-shrink: 0; margin-left: 0.25rem;
  vertical-align: middle;
}
.cfg-tip:hover { color: var(--accent); border-color: var(--accent); }
.cfg-tip .tip-pop {
  display: none; position: absolute; z-index: 40;
  left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%);
  width: 230px; padding: 0.5rem 0.65rem;
  background: var(--text-primary); color: #fff;
  border-radius: 6px; font-size: 0.72rem; font-weight: 400; line-height: 1.55;
  box-shadow: var(--shadow-elevated); text-align: left; white-space: normal;
}
.cfg-tip:hover .tip-pop { display: block; }
.config-panel .cfg-field { margin-bottom: 1rem; }
.config-panel input[type=text], .config-panel select, .config-panel textarea { width: 100%; }
.config-panel textarea { resize: vertical; min-height: 110px; }
/* KB 绑定：已绑定标签 + 添加弹窗 */
.bound-kbs { display: flex; flex-wrap: wrap; gap: 0.35rem; margin-bottom: 0.45rem; min-height: 28px; }
.bound-tag {
  display: inline-flex; align-items: center; gap: 0.3rem;
  font-size: 0.76rem; color: var(--text-secondary);
  background: var(--bg-surface); border: 1px solid var(--border-standard);
  border-radius: 4px; padding: 2px 8px;
}
.bound-tag .bt-dd { color: var(--text-quaternary); font-size: 0.68rem; }
.bound-tag .bt-x { border: none; background: none; cursor: pointer; color: var(--text-quaternary); font-size: 0.8rem; padding: 0; line-height: 1; }
.bound-tag .bt-x:hover { color: var(--red); }
.bound-empty { font-size: 0.72rem; color: var(--text-quaternary); padding: 4px 0; }
.kb-picker-dd { font-size: 0.72rem; font-weight: 600; color: var(--text-tertiary); margin: 0.55rem 0 0.25rem; text-transform: uppercase; letter-spacing: 0.04em; }
.kb-picker-row { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; padding: 0.3rem 0.4rem; border-radius: 4px; font-size: 0.8rem; }
.kb-picker-row:hover { background: var(--bg-surface); }
.kb-picker-row label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; color: var(--text-secondary); flex: 1; }
.kb-picker-row input { width: 14px; height: 14px; accent-color: var(--accent); }
.kb-picker-row .already { font-size: 0.68rem; color: var(--text-quaternary); }
.kb-picker-body { max-height: 340px; overflow-y: auto; margin: 0.5rem 0; }
.cfg-note { font-size: 0.7rem; color: var(--text-quaternary); margin-top: 0.3rem; }
.cfg-inline { display: flex; gap: 0.5rem; align-items: center; }
.cfg-inline select { flex: 1; }
/* 调试对话 */
.preview-panel { display: flex; flex-direction: column; background: var(--bg-panel); border: 1px solid var(--border-subtle); border-radius: var(--radius-lg); box-shadow: var(--shadow-card); height: calc(100vh - 150px); min-height: 480px; }
.preview-head { padding: 0.7rem 1rem; border-bottom: 1px solid var(--border-subtle); font-size: 0.78rem; color: var(--text-tertiary); display: flex; gap: 1rem; align-items: center; }
.preview-head .ph-hint { margin-left: auto; font-size: 0.7rem; color: var(--text-quaternary); }
.msg-area { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.9rem; }
.msg { max-width: 85%; padding: 0.6rem 0.85rem; border-radius: var(--radius-md); font-size: 0.84rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
.msg.user { align-self: flex-end; background: var(--accent-light); color: var(--text-primary); border: 1px solid rgba(94,106,210,0.2); }
.msg.assistant { align-self: flex-start; background: var(--bg-surface); border: 1px solid var(--border-subtle); }
.msg .cursor { display: inline-block; width: 2px; height: 1em; background: var(--accent); vertical-align: -0.15em; animation: blink 0.8s step-end infinite; }
.msg .thinking { font-size: 0.75rem; color: var(--text-quaternary); font-style: italic; margin-right: 0.35rem; }
.msg.error { align-self: flex-start; background: var(--red-bg); border: 1px solid var(--red); color: var(--red); }
.cite-block { align-self: flex-start; max-width: 85%; width: 100%; }
.cite-title { font-size: 0.72rem; color: var(--text-tertiary); font-weight: 500; margin: 0.35rem 0 0.3rem; }
.cite-card { border: 1px solid var(--border-subtle); border-left: 3px solid var(--accent); border-radius: 4px; padding: 0.4rem 0.6rem; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 0.3rem; background: var(--bg-panel); }
.cite-card .cc-src { font-weight: 500; color: var(--text-primary); }
.cite-card .cc-kb { color: var(--accent-text); margin-left: 0.4rem; }
.cite-card .cc-meta { color: var(--text-quaternary); font-size: 0.7rem; margin-left: 0.4rem; }
.input-bar { display: flex; gap: 0.5rem; padding: 0.8rem 1rem; border-top: 1px solid var(--border-subtle); }
.input-bar input { flex: 1; }
.input-bar input:disabled { opacity: 0.6; }
</style>
</head>
<body data-base=".." data-section="workspace" data-sub="chat">
<header id="app-header"></header>
<main>

<div class="edit-top">
  <h2 id="app-title">—</h2>
  <span id="app-status"></span>
  <span class="spacer"></span>
  <button class="secondary" onclick="saveApp()">保存</button>
  <button class="primary" onclick="publishApp()" id="publish-btn">发布</button>
</div>

<div class="edit-layout">

  <!-- 左：配置 -->
  <div class="config-panel">
    <div class="cfg-field">
      <label class="cfg-label">名称 <span class="cfg-tip">?<span class="tip-pop">智能体名称，展示在卡片列表与应用中心。必填，建议简短直白（如「财务制度助手」）。</span></span></label>
      <input type="text" id="cfg-name">
    </div>
    <div class="cfg-field">
      <label class="cfg-label">描述 <span class="cfg-tip">?<span class="tip-pop">用途说明，展示在卡片与应用中心，帮助使用者了解这个智能体能做什么。</span></span></label>
      <input type="text" id="cfg-desc">
    </div>
    <div class="cfg-field">
      <label class="cfg-label">大模型 <span class="cfg-tip">?<span class="tip-pop">回答生成用的 LLM（来自模型配置中心）。空 = 系统默认，解析顺序：本应用 → 系统默认(llm) → 环境配置。</span></span></label>
      <select id="cfg-model"><option value="">系统默认</option></select>
    </div>
    <div class="cfg-field">
      <label class="cfg-label">系统提示词 <span class="cfg-tip">?<span class="tip-pop">人设/风格/边界（如「你是财务部助手，回答简洁」）。引用标注 [1][2]、只基于资料回答等结构规则会自动追加，不可修改。</span></span></label>
      <textarea id="cfg-prompt"></textarea>
      <button class="btn-sm" style="margin-top:0.35rem" onclick="resetPrompt()">↺ 重置默认模板</button>
    </div>
    <div class="cfg-field">
      <label class="cfg-label">知识库绑定 <span class="cfg-tip">?<span class="tip-pop">限定检索范围。空 = 全租户自动路由（按问题语义路由到最相关的数据域/知识库）；绑定后只在这些知识库内检索。</span></span></label>
      <div id="bound-kbs" class="bound-kbs"></div>
      <button class="btn-sm" onclick="showKBPicker()" id="kb-add-btn">＋ 添加知识库</button>
    </div>
    <div class="cfg-field">
      <label class="cfg-label">检索参数</label>
      <div style="margin-bottom:0.5rem">
        <label class="cfg-label" style="margin-bottom:0.2rem">检索方式 <span class="cfg-tip">?<span class="tip-pop">混合 = 向量语义 + 关键词精确命中融合（推荐，兼顾语义与术语）；向量 = 仅语义相似度（对术语/编号敏感度低）。</span></span></label>
        <select id="cfg-mode" style="width:100%">
          <option value="hybrid">混合检索</option>
          <option value="vector">向量检索</option>
        </select>
      </div>
      <div style="margin-bottom:0.5rem">
        <label class="cfg-label" style="margin-bottom:0.2rem">TopK <span class="cfg-tip">?<span class="tip-pop">每次检索返回的片段数。越大信息越全但噪音越多、LLM 上下文越长；知识问答一般 3~10。</span></span></label>
        <select id="cfg-topk" style="width:100%">
          <option value="3">TopK 3</option><option value="5" selected>TopK 5</option>
          <option value="10">TopK 10</option><option value="20">TopK 20</option>
        </select>
      </div>
      <div class="cfg-inline">
        <label class="cfg-label" style="margin:0;white-space:nowrap">相似度阈值 <span class="cfg-tip">?<span class="tip-pop">过滤低置信的向量命中（相似度低于阈值不返回）。0 = 不过滤；建议 0.3~0.5（bge-m3 相关片段通常 0.5+）。仅影响向量路，关键词精确命中不受限。</span></span></label>
        <input type="number" id="cfg-threshold" min="0" max="1" step="0.05" value="0.0" style="width:80px">
      </div>
    </div>
    <div class="cfg-field">
      <label class="cfg-label">生成参数（LLM 推理）</label>
      <div class="cfg-inline" style="margin-bottom:0.5rem">
        <label class="cfg-label" style="margin:0;white-space:nowrap">温度 <span class="cfg-tip">?<span class="tip-pop">回答随机性。越低越确定（事实问答建议 0.3~0.7，避免编造），越高越发散创新。</span></span></label>
        <input type="range" id="cfg-temperature" min="0" max="2" step="0.1" value="0.7" style="flex:1" oninput="document.getElementById('cfg-temperature-v').textContent=this.value">
        <span id="cfg-temperature-v" style="width:2.2rem;text-align:right;font-size:0.75rem;color:var(--text-tertiary)">0.7</span>
      </div>
      <div class="cfg-inline" style="margin-bottom:0.5rem">
        <label class="cfg-label" style="margin:0;white-space:nowrap">Top P <span class="cfg-tip">?<span class="tip-pop">核采样：只从累计概率达 top_p 的候选词中采样。0.9 为常用值；与温度协同，一般保持默认。</span></span></label>
        <input type="range" id="cfg-topp" min="0" max="1" step="0.05" value="0.9" style="flex:1" oninput="document.getElementById('cfg-topp-v').textContent=this.value">
        <span id="cfg-topp-v" style="width:2.2rem;text-align:right;font-size:0.75rem;color:var(--text-tertiary)">0.9</span>
      </div>
      <div class="cfg-inline">
        <label class="cfg-label" style="margin:0;white-space:nowrap">Max Tokens <span class="cfg-tip">?<span class="tip-pop">回答最大生成长度（Ollama num_predict）。知识问答一般 512~2048；过长会截断。</span></span></label>
        <input type="number" id="cfg-maxtokens" min="128" max="8192" step="128" value="1024" style="width:90px">
      </div>
    </div>
    <div class="cfg-field">
      <label class="cfg-label">多轮上下文轮数 <span class="cfg-tip">?<span class="tip-pop">LLM 能看到的最近对话轮数（按 user+assistant 配对）。越多追问指代消解越强，但上下文 token 越长。</span></span></label>
      <select id="cfg-turns">
        <option value="2">2 轮</option><option value="4">4 轮</option>
        <option value="6" selected>6 轮</option><option value="10">10 轮</option>
      </select>
    </div>
  </div>

  <!-- 右：调试预览 -->
  <div class="preview-panel">
    <div class="preview-head">
      <span>调试对话</span>
      <button class="btn-sm secondary" onclick="clearChat()">清空对话</button>
      <span class="ph-hint">Enter 发送 · 引用自动标注 [1][2]</span>
    </div>
    <div class="msg-area" id="msg-area">
      <p class="kb-empty" id="chat-empty-hint">配置左侧参数后，在下方输入问题开始调试（自动保存前请先点「保存」）。</p>
    </div>
    <div class="input-bar">
      <input id="chat-input" placeholder="输入问题…" onkeydown="if(event.key==='Enter')send()">
      <button class="primary" onclick="send()" id="send-btn">发送</button>
    </div>
  </div>

</div>
</main>
<script src="../js/app.js"></script>
<script src="../js/nav.js"></script>
<script>
// ── Chat 智能体编排页（设计 §5.2）：左配置 / 右调试预览 ──
var DEFAULT_PROMPT = '你是企业知识库智能助手。请基于提供的资料准确回答用户问题；资料不足时明确说明，不要编造。回答用中文，简洁清晰。';
var state = { app: null, kbs: [], models: [], convId: null, streaming: false, promptTouched: false, kbScope: [], ddNames: {} };

var appId = new URLSearchParams(location.search).get('app') || '';

document.addEventListener('DOMContentLoaded', init);

async function init() {
  if (!appId) { document.getElementById('app-title').textContent = '缺少 app 参数'; return; }
  await Promise.all([loadApp(), loadKBs(), loadModels()]);
  renderConfig();
}

async function loadApp() {
  try { state.app = await EARP.fetchJSON('/chat_apps/' + encodeURIComponent(appId)); }
  catch (err) { document.getElementById('app-title').textContent = '加载失败: ' + err.message; }
}

async function loadKBs() {
  try {
    state.kbs = await EARP.fetchJSON('/knowledge/bases');
  } catch (e) { state.kbs = []; }
  try {
    var dds = await EARP.fetchJSON('/api/data-domains');
    state.ddNames = {};
    dds.forEach(function (d) { state.ddNames[d.data_domain_id] = d.name; });
  } catch (e) { /* 保持空映射 */ }
}

async function loadModels() {
  try {
    var all = await EARP.fetchJSON('/api/model-configs');
    state.models = all.filter(function (m) { return m.model_type === 'llm' && m.enabled; });
  } catch (e) { state.models = []; }
}

function statusTag(s) {
  return s === 'published'
    ? '<span class="tag tag-green">已发布</span>'
    : '<span class="tag tag-accent">草稿</span>';
}

function renderConfig() {
  var a = state.app;
  if (!a) return;
  document.getElementById('app-title').textContent = a.name;
  document.getElementById('app-status').innerHTML = statusTag(a.status);
  document.getElementById('cfg-name').value = a.name || '';
  document.getElementById('cfg-desc').value = a.description || '';
  document.getElementById('cfg-prompt').value = a.system_prompt || DEFAULT_PROMPT;
  document.getElementById('cfg-model').innerHTML = '<option value="">系统默认</option>'
    + state.models.map(function (m) {
      var sel = m.config_id === a.model_config_id ? ' selected' : '';
      return '<option value="' + m.config_id + '"' + sel + '>' + esc(m.model_name) + ' (' + m.provider + ')</option>';
    }).join('');
  var ret = a.retrieval || {};
  document.getElementById('cfg-mode').value = ret.mode || 'hybrid';
  document.getElementById('cfg-topk').value = String(ret.top_k || 5);
  document.getElementById('cfg-threshold').value = ret.threshold != null ? ret.threshold : 0.0;
  document.getElementById('cfg-turns').value = String(a.context_turns || 6);

  var gen = a.generation || {};
  document.getElementById('cfg-temperature').value = gen.temperature != null ? gen.temperature : 0.7;
  document.getElementById('cfg-temperature-v').textContent = gen.temperature != null ? gen.temperature : 0.7;
  document.getElementById('cfg-topp').value = gen.top_p != null ? gen.top_p : 0.9;
  document.getElementById('cfg-topp-v').textContent = gen.top_p != null ? gen.top_p : 0.9;
  document.getElementById('cfg-maxtokens').value = gen.max_tokens || 1024;

  state.kbScope = (a.kb_scope || []).slice();
  renderBoundKBs();
  document.getElementById('publish-btn').disabled = a.status === 'published';
  document.getElementById('publish-btn').textContent = a.status === 'published' ? '已发布' : '发布';
}

// ── KB 绑定：已绑定标签 + 添加弹窗（按 DD 分组）──
function kbName(id) {
  var kb = state.kbs.find(function (k) { return k.knowledge_base_id === id; });
  return kb ? (kb.name || id) : id;
}

function kbDD(id) {
  var kb = state.kbs.find(function (k) { return k.knowledge_base_id === id; });
  return kb && kb.data_domain_id ? kb.data_domain_id : '';
}

function renderBoundKBs() {
  var el = document.getElementById('bound-kbs');
  if (!state.kbScope.length) {
    el.innerHTML = '<span class="bound-empty">未绑定 — 全租户自动路由</span>';
    return;
  }
  el.innerHTML = state.kbScope.map(function (id) {
    var dd = kbDD(id);
    return '<span class="bound-tag">' + esc(kbName(id))
      + (dd ? '<span class="bt-dd">' + esc(state.ddNames[dd] || dd) + '</span>' : '')
      + '<button class="bt-x" onclick="removeBoundKB(\'' + id + '\')" title="移除">✕</button></span>';
  }).join('');
}

function removeBoundKB(id) {
  state.kbScope = state.kbScope.filter(function (x) { return x !== id; });
  renderBoundKBs();
}

function showKBPicker() {
  var modal = document.getElementById('kb-picker-modal');
  if (!modal) { createKBPickerModal(); modal = document.getElementById('kb-picker-modal'); }
  // 按 DD 分组渲染（未分配 DD 归「未分配」）
  var groups = {};
  state.kbs.forEach(function (kb) {
    var dd = kb.data_domain_id || '__none__';
    (groups[dd] = groups[dd] || []).push(kb);
  });
  var html = '';
  Object.keys(groups).sort().forEach(function (dd) {
    var ddLabel = dd === '__none__' ? '未分配数据域' : (state.ddNames[dd] || dd);
    html += '<div class="kb-picker-dd">' + esc(ddLabel) + '</div>';
    groups[dd].forEach(function (kb) {
      var bound = state.kbScope.indexOf(kb.knowledge_base_id) >= 0;
      html += '<div class="kb-picker-row">'
        + '<label><input type="checkbox" class="kb-pick" value="' + kb.knowledge_base_id + '"' + (bound ? ' checked disabled' : '') + '>'
        + esc(kb.name || kb.knowledge_base_id) + '</label>'
        + (bound ? '<span class="already">已添加</span>' : '')
        + '</div>';
    });
  });
  document.getElementById('kb-picker-body').innerHTML = html || '<div class="kb-empty">暂无知识库（请先在知识中心创建）</div>';
  modal.style.display = 'flex';
}

function hideKBPicker() { document.getElementById('kb-picker-modal').style.display = 'none'; }

function createKBPickerModal() {
  var html = '<div id="kb-picker-modal" class="modal-overlay" style="display:none" onclick="if(event.target===this)hideKBPicker()">'
    + '<div class="modal" style="min-width:420px"><h4>添加知识库</h4>'
    + '<p style="font-size:0.75rem;color:var(--text-tertiary);margin-bottom:0.25rem">按数据域分组选择要绑定的知识库；已添加项置灰。</p>'
    + '<div class="kb-picker-body" id="kb-picker-body"></div>'
    + '<div class="form-actions"><button class="primary" onclick="confirmKBPicker()">添加选中</button>'
    + '<button class="btn-sm" onclick="hideKBPicker()">取消</button></div>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

function confirmKBPicker() {
  var picked = [];
  document.querySelectorAll('#kb-picker-body .kb-pick:checked').forEach(function (el) { picked.push(el.value); });
  picked.forEach(function (id) {
    if (state.kbScope.indexOf(id) < 0) state.kbScope.push(id);
  });
  hideKBPicker();
  renderBoundKBs();
}

function collectConfig() {
  return {
    name: document.getElementById('cfg-name').value.trim(),
    description: document.getElementById('cfg-desc').value.trim(),
    system_prompt: document.getElementById('cfg-prompt').value.trim(),
    model_config_id: document.getElementById('cfg-model').value || null,
    kb_scope: state.kbScope.slice(),
    retrieval: {
      mode: document.getElementById('cfg-mode').value,
      top_k: parseInt(document.getElementById('cfg-topk').value, 10) || 5,
      threshold: parseFloat(document.getElementById('cfg-threshold').value) || 0.0,
    },
    generation: {
      temperature: parseFloat(document.getElementById('cfg-temperature').value) || 0.7,
      top_p: parseFloat(document.getElementById('cfg-topp').value) || 0.9,
      max_tokens: parseInt(document.getElementById('cfg-maxtokens').value, 10) || 1024,
    },
    context_turns: parseInt(document.getElementById('cfg-turns').value, 10) || 6,
  };
}

function resetPrompt() { document.getElementById('cfg-prompt').value = DEFAULT_PROMPT; }

async function saveApp(quiet) {
  if (!state.app) return;
  var body = collectConfig();
  var btn = document.querySelector('.edit-top .secondary');
  if (btn) { btn.disabled = true; btn.textContent = '保存中…'; }
  try {
    var upd = await EARP.fetchJSON('/chat_apps/' + encodeURIComponent(appId), {
      method: 'PATCH', body: JSON.stringify(body),
    });
    state.app = upd;
    if (upd.status === 'draft' && body.name === upd.name) {
      // 已发布 → 编辑后回 draft
      if (!quiet) alert('已保存。原已发布应用已回到「草稿」，需重新测试并发布。');
    }
    renderConfig();
  } catch (err) { alert('保存失败: ' + err.message); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '保存'; } }
}

async function publishApp() {
  if (!state.app) return;
  if (state.app.status === 'published') return;
  if (!confirm('确认发布？发布后可在「应用中心」查看。')) return;
  try {
    var pub = await EARP.fetchJSON('/chat_apps/' + encodeURIComponent(appId) + '/publish', { method: 'POST' });
    state.app = pub;
    alert('已发布，可在应用中心查看。');
    renderConfig();
  } catch (err) { alert('发布失败: ' + err.message); }
}

// ── 调试对话（流式 + 引用卡）──
function clearChat() {
  document.getElementById('msg-area').innerHTML = '';
  state.convId = null;
}

function appendMsg(role, text) {
  var area = document.getElementById('msg-area');
  document.getElementById('chat-empty-hint') && (document.getElementById('chat-empty-hint').style.display = 'none');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function appendCitations(citations) {
  if (!citations || !citations.length) return;
  var area = document.getElementById('msg-area');
  var block = document.createElement('div');
  block.className = 'cite-block';
  // 按文档聚合：同一文档的多个片段合并为一条引用卡（标注片段编号集合 + 最高相似度）
  var groups = {};
  citations.forEach(function (c, i) {
    var key = c.document_id || c.chunk_id || 'src-' + i;
    if (!groups[key]) groups[key] = { title: c.title || '未命名', kb: c.kb_name || c.kb_id || '', meta: c.metadata || {}, refs: [], sim: 0 };
    groups[key].refs.push(i + 1);
    groups[key].sim = Math.max(groups[key].sim, c.similarity || 0);
  });
  var html = '<div class="cite-title">依据</div>';
  Object.keys(groups).forEach(function (key) {
    var g = groups[key];
    var meta = '';
    if (g.meta.version) meta += ' · ' + g.meta.version;
    if (g.meta.year) meta += ' (' + g.meta.year + ')';
    html += '<div class="cite-card"><span class="cc-src">' + g.refs.map(function (r) { return '[' + r + ']'; }).join(' ') + ' ' + esc(g.title) + '</span>'
      + '<span class="cc-kb">' + esc(g.kb) + '</span>'
      + '<span class="cc-meta">' + esc(meta) + ' · 相似度 ' + (g.sim ? g.sim.toFixed(2) : '-') + '</span></div>';
  });
  block.innerHTML = html;
  area.appendChild(block);
  area.scrollTop = area.scrollHeight;
}

async function send() {
  if (state.streaming) return;
  var input = document.getElementById('chat-input');
  var query = input.value.trim();
  if (!query) return;
  if (!state.app) { alert('智能体未加载'); return; }

  input.value = '';
  appendMsg('user', query);
  var answerEl = appendMsg('assistant', '');
  answerEl.innerHTML = '<span class="thinking">正在思考…</span><span class="cursor"></span>';
  var tokens = [];
  var sendBtn = document.getElementById('send-btn');
  state.streaming = true;
  input.disabled = true; sendBtn.disabled = true;

  try {
    await EARP.streamSSE('/chat_apps/' + encodeURIComponent(appId) + '/chat', {
      query: query,
      conversation_id: state.convId,
    }, function (ev) {
      if (ev.type === 'token') {
        tokens.push(ev.content);
        // 首个 token 到达后移除「思考中」占位
        answerEl.textContent = tokens.join('');
        answerEl.insertAdjacentHTML('beforeend', '<span class="cursor"></span>');
        answerEl.scrollTop = answerEl.scrollHeight;
        document.getElementById('msg-area').scrollTop = document.getElementById('msg-area').scrollHeight;
      } else if (ev.type === 'done') {
        state.convId = ev.conversation_id;
        answerEl.textContent = tokens.join('');
        appendCitations(ev.citations);
      } else if (ev.type === 'error') {
        answerEl.className = 'msg assistant error';
        answerEl.textContent = tokens.length ? tokens.join('') + '\n\n⚠ ' + ev.message : ev.message;
      }
    });
  } catch (err) {
    answerEl.className = 'msg assistant error';
    answerEl.textContent = tokens.length ? tokens.join('') + '\n\n⚠ ' + err.message : '请求失败: ' + err.message;
  } finally {
    state.streaming = false;
    input.disabled = false; sendBtn.disabled = false;
    input.focus();
  }
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
