<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>项目配置 · EARP</title><link rel="stylesheet" href="../css/admin.css"><link rel="stylesheet" href="../css/ecmc.css"></head>
<body data-base=".." data-section="knowledge" data-sub="catalog-profiles" data-catalog-page="profiles">
<header id="app-header"></header><main><div class="page-title"><div><h2>项目配置</h2><p class="page-subtitle">Catalog Profile · scope / 数据域 / 角色 / backup approver</p></div><button class="btn-sm primary" data-catalog-disabled>+ 新建项目配置</button></div>
<div id="catalog-readiness" class="ecmc-errorbar"></div><p id="profile-summary" class="page-subtitle"></p><div class="ecmc-empty-state" style="text-align:left"><p>新建 Profile 草稿</p><small>Profile 仅配置 scope、data domain 和治理角色，不定义任何语义对象。</small><form id="catalog-profile-create-form" class="ecmc-field" style="max-width:640px"><label>Profile ID<input name="profile_id" required maxlength="128"></label><label>Catalog Profile ID<input name="catalog_profile_id" required maxlength="128"></label><label>行业 scope<input name="industry_scope" required maxlength="128"></label><label>企业 scope<input name="enterprise_scope" required maxlength="128"></label><label>数据域<input name="data_domain_id" required maxlength="64"></label><label>backup approver role<input name="backup_approver" required maxlength="128"></label><label>roles JSON<textarea name="roles" rows="5" required placeholder='[{"role_key":"product_owner","name":"待配置","team":"待配置","contact":null}]'></textarea></label><button class="btn-sm primary" type="submit">创建 Profile 草稿</button></form></div><div class="ecmc-toolbar"><input type="search" placeholder="profile_id / 企业名称" disabled><select disabled><option>全部状态</option></select></div>
<div id="profile-list"></div><div id="profile-empty" class="ecmc-empty-state"><p>暂无项目配置</p><small>Profile schema v2 支持可配置角色、单一 data_domain 和 backup approver；真实 Profile API 就绪后可创建。</small></div></main>
<script src="../js/app.js"></script><script src="../js/nav.js"></script><script src="../js/ecmc-api.js"></script><script src="../js/ecmc-common.js"></script><script src="../js/catalog-pages.js"></script></body></html>
