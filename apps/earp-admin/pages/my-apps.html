<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="EARP 我的应用"><title>我的应用 — EARP</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"><link rel="stylesheet" href="../css/admin.css">
</head>
<body data-base=".." data-section="apps" data-sub="mine" data-page="my-apps">
<header id="app-header"></header>
<main>
<div class="page-title"><div><h2>我的应用</h2><p class="page-subtitle">我收藏的智能体 — 在「智能体」页点 ⭐ 收藏后出现在这里；支持同样的分类 / 搜索</p></div></div>

<div class="app-toolbar">
  <input type="search" id="f-q" placeholder="搜索名称 / 描述 / 创建人 / 标签…">
  <select id="f-cat"><option value="">全部分类</option></select>
  <select id="f-type">
    <option value="">全部类型</option>
    <option value="chat">chat</option>
    <option value="flow">chatflow</option>
  </select>
  <select id="f-sort">
    <option value="latest">最新发布</option>
    <option value="hot">最热（收藏数）</option>
  </select>
</div>

<div class="app-grid" id="app-grid">
  <p class="kb-empty">加载中…</p>
</div>
</main>

<!-- 运行抽屉 -->
<div class="run-drawer-overlay" id="run-drawer">
  <div class="run-drawer">
    <div class="run-drawer-header">
      <h3 id="rd-name">—</h3>
      <span class="ac-cat" id="rd-sub"></span>
      <button class="btn-sm btn-outline" id="rd-fav" title="收藏">☆ 收藏</button>
      <button class="btn-sm btn-outline" id="rd-full" title="全屏运行页">⛶ 全屏</button>
      <button class="btn-sm btn-outline" id="rd-close" title="关闭">✕</button>
    </div>
    <div class="run-drawer-msgs" id="rd-msgs"></div>
    <div id="rd-ha" class="ha-bar" style="display:none;margin:0 1rem 0.5rem;"></div>
    <div class="run-drawer-input">
      <textarea id="rd-input" rows="1" placeholder="输入消息…（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="primary" id="rd-send">发送</button>
    </div>
  </div>
</div>

<script src="../js/app.js"></script>
<script src="../js/nav.js"></script>
<script src="../js/apps.js"></script>
</body></html>
