<head>

<title>EARP Assistant</title>

<header>
  <span class="brand">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>
    EARP Assistant
  </span>
  <nav>
    <a href="index.html" class="active" aria-current="page">Chat</a>

    <a href="pages/history.html">History</a>

<div class="chat-container">
  <div class="chat-messages" id="messages">
    <!-- TODO: wire to Conversation API -->
    <div class="welcome">
      <h2>👋 Hi, I'm EARP Assistant</h2>
      <p>Ask me anything — I can query data, run analysis, and search your knowledge base.</p>
      <div class="suggestions">
        <button>Query all active users</button>
        <button>Search deployment guide</button>
        <button>Generate weekly report</button>
      </div>
    </div>
  </div>

  <div class="chat-input">
    <textarea placeholder="Type your message..." rows="1" id="input"></textarea>
    <button class="primary" title="Send">↑</button>
  </div>
</div>

</body>
