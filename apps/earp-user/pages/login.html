<!DOCTYPE html>
<html lang="zh"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="description" content="EARP Login"><title>Login — EARP</title><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/app.css"></head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-root)">
<div style="max-width:380px;width:100%;padding:2rem;background:var(--bg-panel);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-card)">
<h2 style="text-align:center;margin-bottom:1.5rem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:1.2em;height:1.2em;color:var(--accent);vertical-align:-0.2em"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg> EARP</h2>
<!-- TODO: wire to backend JWT auth -->
<div style="display:flex;flex-direction:column;gap:0.75rem">
<label style="font-size:0.81rem;color:var(--text-tertiary)">Tenant ID <input type="text" placeholder="tenant-demo" value="tenant-demo"></label>
<label style="font-size:0.81rem;color:var(--text-tertiary)">User ID <input type="text" placeholder="u1" value="u1"></label>
<label style="font-size:0.81rem;color:var(--text-tertiary)">Password <input type="password" placeholder="••••••"></label>
<button class="primary" style="width:100%;margin-top:0.5rem">Sign in</button>
</div>
<p style="text-align:center;font-size:0.75rem;color:var(--text-quaternary);margin-top:1.25rem">dev: EARP_AUTH_STRATEGY=dev-skip</p>
</div>
</body></html>
