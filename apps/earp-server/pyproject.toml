[project]
name = "earp-server"
version = "0.1.0"
description = "EARP Enterprise AI Runtime Platform - server (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "procrastinate>=3.6",
    "tenacity>=8.5",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "pyjwt>=2.13.0",
    "redis>=8.0.1",
    "httpx>=0.27",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=3.0",
    "cryptography>=50.0.0",
    "python-docx>=1.2.0",
    "pypdf>=6.15.0",
    "python-multipart>=0.0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "import-linter>=2.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earp_server"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]
# B008: FastAPI idiom — File()/Form()/Depends() in argument defaults
ignore = ["B008"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# FastAPI route closures + starlette request.state are dynamically typed.
reportUnusedFunction = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportMissingParameterType = false
reportUnknownVariableType = false
reportUnknownParameterType = false
# SQLAlchemy Row._mapping is public API; bare dict is idiomatic in FastAPI.
# Redis stubs have incomplete type annotations (xreadgroup, xadd).
reportPrivateUsage = false
reportMissingTypeArgument = false
reportGeneralTypeIssues = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "earp_server"

[[tool.importlinter.contracts]]
name = "domain modules are independent"
type = "independence"
modules = [
    "earp_server.gateway",
    "earp_server.runtime",
    "earp_server.capability",
    "earp_server.policy",
    "earp_server.planner",
    "earp_server.knowledge",
    "earp_server.conversation",
    "earp_server.schedule",
    "earp_server.audit",
    "earp_server.orchestrator",
    "earp_server.plugin",
    "earp_server.mcp",
]
# Architectural exceptions — intentional cross-domain coupling.
# connector is the cross-cutting LLM glue; its imports from planner/orchestrator
# are by design (planner for fallback matching, orchestrator for Step types).
ignore_imports = [
    "earp_server.runtime.invoke -> earp_server.capability.registry",
    "earp_server.runtime.invoke -> earp_server.orchestrator.types",
    "earp_server.runtime.invoke -> earp_server.orchestrator.step_runner",
    "earp_server.runtime.invoke -> earp_server.orchestrator.layers",
    "earp_server.planner.validation -> earp_server.orchestrator.types",
    "earp_server.planner.task_planner -> earp_server.orchestrator.types",
    "earp_server.planner.task_planner -> earp_server.connector",
    "earp_server.capability.registry -> earp_server.knowledge.embedding_service",
    "earp_server.orchestrator.multi_step -> earp_server.connector",
    "earp_server.orchestrator.step_runner -> earp_server.connector",
    "earp_server.connector -> earp_server.planner.business_dictionary",
    "earp_server.connector -> earp_server.orchestrator.types",
    "earp_server.planner.service -> earp_server.knowledge.routing",  # D-13: keyword table lives in knowledge domain
    # tech-debt #9: knowledge.routing 复用 policy.roles_service.role_domain_access（域过滤单一实现）
    "earp_server.knowledge.routing -> earp_server.policy.roles_service",
    # tech-debt #9 漏洞修复: search_service 域门禁（无 scope 兜底/显式 scope 一律交叠角色允许域）
    "earp_server.knowledge.search_service -> earp_server.policy.roles_service",
    # P1 问答链路一期：conversation.chat_service 是 RAG 编排层——检索/路由/LLM 均为编排依赖
    "earp_server.conversation.chat_service -> earp_server.knowledge.embedding_service",
    "earp_server.conversation.chat_service -> earp_server.knowledge.search_service",
    "earp_server.conversation.chat_service -> earp_server.knowledge.routing",
    "earp_server.conversation.chat_service -> earp_server.connector",
    # P2: chat 软路由路径接入 ontology 三层检索（ontology.search 传递依赖 knowledge.search_service）
    "earp_server.conversation.chat_service -> earp_server.ontology.search",
    # Phase D D1d: chat 软路由路径走 planner（understanding/planning/capability_query 传递依赖 knowledge.*）
    "earp_server.conversation.chat_service -> earp_server.ontology.planning",
    "earp_server.conversation.chat_service -> earp_server.ontology.understanding",
    "earp_server.conversation.chat_service -> earp_server.ontology.capability_query",
    # Chatflow F1: flow_schema 声明层校验复用 orchestrator workflow_dsl（F0 编译校验单一实现，
    # 图结构校验不重复实现——chat_app_service 是 flow 声明的入口）
    "earp_server.conversation.chat_app_service -> earp_server.orchestrator.workflow_dsl",
    # Chatflow F2: flow 模式图执行编排——对话层是图执行的编排方（编译 + MultiStepExecutor）
    "earp_server.conversation.chat_service -> earp_server.orchestrator.multi_step",
    "earp_server.conversation.chat_service -> earp_server.orchestrator.workflow_dsl",
]
