[project]
name = "earp-server"
version = "0.1.0"
description = "EARP Enterprise AI Runtime Platform - server (modular monolith)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "psycopg[binary,pool]>=3.2",
    "alembic>=1.13",
    "procrastinate>=3.6",
    "tenacity>=8.5",
    "pgvector>=0.3",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "pyjwt>=2.13.0",
    "redis>=8.0.1",
    "httpx>=0.27",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "import-linter>=2.0",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earp_server"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "spikes"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
# FastAPI route closures + starlette request.state are dynamically typed.
reportUnusedFunction = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportMissingParameterType = false
reportUnknownVariableType = false
reportUnknownParameterType = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.importlinter]
root_package = "earp_server"

[[tool.importlinter.contracts]]
name = "domain modules are independent"
type = "independence"
modules = [
    "earp_server.gateway",
    "earp_server.runtime",
    "earp_server.capability",
    "earp_server.policy",
    "earp_server.planner",
    "earp_server.knowledge",
    "earp_server.conversation",
    "earp_server.schedule",
    "earp_server.audit",
    "earp_server.orchestrator",
    "earp_server.planner",
    "earp_server.knowledge",
    "earp_server.conversation",
    "earp_server.plugin",
    "earp_server.mcp",
]
# M1: runtime calls capability.discover (public service interface) and uses
# orchestrator types — both are allowed cross-module references (plan v1.4 §5.1 "走 service 接口").
ignore_imports = [
    "earp_server.runtime -> earp_server.capability",
    "earp_server.runtime -> earp_server.orchestrator",
    "earp_server.orchestrator -> earp_server.infra",
    "earp_server.runtime -> earp_server.infra",
]
