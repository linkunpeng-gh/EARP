        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Update Model Config Api Model Configs  Config Id  Put
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Model Config
      tags:
      - models
  /api/model-configs/{config_id}/test:
    post:
      operationId: test_model_config_api_model_configs__config_id__test_post
      parameters:
      - in: path
        name: config_id
        required: true
        schema:
          title: Config Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Test Model Config Api Model Configs  Config Id  Test
                  Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Test Model Config
      tags:
      - models
  /api/model-providers:
    get:
      description: Provider catalog + per-provider configured models.
      operationId: list_providers_api_model_providers_get
      responses:
        '200':
          content:
