components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    InvokeRequest:
      properties:
        capability_id:
          title: Capability Id
          type: string
        input:
          additionalProperties:
            type: string
          default: {}
          title: Input
          type: object
      required:
      - capability_id
      title: InvokeRequest
      type: object
    InvokeResponse:
      properties:
        checkpoint_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Checkpoint Id
        error:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Error
        execution_id:
          title: Execution Id
          type: string
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        status:
          title: Status
          type: string
      required:
      - execution_id
      - status
      title: InvokeResponse
      type: object
    SessionCreateRequest:
      properties:
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        role_id:
          minLength: 1
          title: Role Id
          type: string
        tenant_id:
          minLength: 1
          title: Tenant Id
          type: string
        user_id:
          minLength: 1
          title: User Id
          type: string
      required:
      - user_id
      - tenant_id
      - role_id
      title: SessionCreateRequest
      type: object
    SessionResponse:
      properties:
        session_id:
          title: Session Id
          type: string
        status:
          default: active
          title: Status
          type: string
        tenant_id:
          title: Tenant Id
          type: string
        user_id:
          title: User Id
          type: string
      required:
      - session_id
      - tenant_id
      - user_id
      title: SessionResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: EARP Server
  version: 0.1.0
openapi: 3.1.0
paths:
  /capabilities:
    get:
      operationId: discover_capabilities_endpoint_capabilities_get
      parameters:
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                title: Response Discover Capabilities Endpoint Capabilities Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Discover Capabilities Endpoint
      tags:
      - capabilities
    post:
      operationId: register_capability_endpoint_capabilities_post
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Register Capability Endpoint Capabilities Post
                type: object
          description: Successful Response
      summary: Register Capability Endpoint
      tags:
      - capabilities
  /health:
    get:
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health Health Get
                type: object
          description: Successful Response
      summary: Health
  /ready:
    get:
      operationId: ready_ready_get
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Ready Ready Get
          description: Successful Response
      summary: Ready
  /v1/sessions:
    post:
      operationId: create_session_endpoint_v1_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Session Endpoint
      tags:
      - sessions
  /v1/sessions/{session_id}:
    get:
      operationId: get_session_endpoint_v1_sessions__session_id__get
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          title: Session Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Session Endpoint
      tags:
      - sessions
  /v1/sessions/{session_id}/close:
    post:
      operationId: close_session_endpoint_v1_sessions__session_id__close_post
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          title: Session Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Close Session Endpoint V1 Sessions  Session Id  Close
                  Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Close Session Endpoint
      tags:
      - sessions
  /v1/sessions/{session_id}/invoke:
    post:
      operationId: invoke_v1_sessions__session_id__invoke_post
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          title: Session Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Invoke
      tags:
      - sessions
