components:
  schemas:
    ConvCreate:
      properties:
        title:
          default: ''
          title: Title
          type: string
      title: ConvCreate
      type: object
    DocUpload:
      properties:
        content:
          title: Content
          type: string
        knowledge_base_id:
          title: Knowledge Base Id
          type: string
        title:
          default: ''
          title: Title
          type: string
      required:
      - knowledge_base_id
      - content
      title: DocUpload
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    InvokeRequest:
      properties:
        capability_id:
          title: Capability Id
          type: string
        input:
          additionalProperties:
            type: string
          default: {}
          title: Input
          type: object
      required:
      - capability_id
      title: InvokeRequest
      type: object
    InvokeResponse:
      properties:
        checkpoint_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Checkpoint Id
        error:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Error
        execution_id:
          title: Execution Id
          type: string
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        status:
          title: Status
          type: string
      required:
      - execution_id
      - status
      title: InvokeResponse
      type: object
    MsgAdd:
      properties:
        content:
          title: Content
          type: string
        role:
          title: Role
          type: string
      required:
      - role
      - content
      title: MsgAdd
      type: object
    PlanRequest:
      properties:
        intent:
          title: Intent
          type: string
      required:
      - intent
      title: PlanRequest
      type: object
    SearchQuery:
      properties:
        query:
          title: Query
          type: string
        top_k:
          default: 5
          title: Top K
          type: integer
      required:
      - query
      title: SearchQuery
      type: object
    SessionCreateRequest:
      properties:
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        role_id:
          minLength: 1
          title: Role Id
          type: string
        tenant_id:
          minLength: 1
          title: Tenant Id
          type: string
        user_id:
          minLength: 1
          title: User Id
          type: string
      required:
      - user_id
      - tenant_id
      - role_id
      title: SessionCreateRequest
      type: object
    SessionResponse:
      properties:
        session_id:
          title: Session Id
          type: string
        status:
          default: active
          title: Status
          type: string
        tenant_id:
          title: Tenant Id
          type: string
        user_id:
          title: User Id
          type: string
      required:
      - session_id
      - tenant_id
      - user_id
      title: SessionResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: EARP Server
  version: 0.1.0
openapi: 3.1.0
paths:
  /capabilities:
    get:
      operationId: discover_capabilities_endpoint_capabilities_get
      parameters:
      - in: query
        name: q
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                title: Response Discover Capabilities Endpoint Capabilities Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Discover Capabilities Endpoint
      tags:
      - capabilities
    post:
      operationId: register_capability_endpoint_capabilities_post
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Register Capability Endpoint Capabilities Post
                type: object
          description: Successful Response
      summary: Register Capability Endpoint
      tags:
      - capabilities
  /conversations:
    post:
      operationId: create_conv_conversations_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Create Conv Conversations Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Conv
      tags:
      - conversations
  /conversations/{conv_id}/messages:
    get:
      operationId: list_msgs_conversations__conv_id__messages_get
      parameters:
      - in: path
        name: conv_id
        required: true
        schema:
          title: Conv Id
          type: string
      - in: query
        name: limit
        required: false
        schema:
          default: 50
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                title: Response List Msgs Conversations  Conv Id  Messages Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Msgs
      tags:
      - conversations
    post:
      operationId: add_msg_conversations__conv_id__messages_post
      parameters:
      - in: path
        name: conv_id
        required: true
        schema:
          title: Conv Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MsgAdd'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Add Msg Conversations  Conv Id  Messages Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Add Msg
      tags:
      - conversations
  /health:
    get:
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health Health Get
                type: object
          description: Successful Response
      summary: Health
  /intents:
    get:
      operationId: list_intents_endpoint_intents_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  type: string
                title: Response List Intents Endpoint Intents Get
                type: array
          description: Successful Response
      summary: List Intents Endpoint
      tags:
      - planner
  /knowledge/documents:
    post:
      operationId: upload_document_knowledge_documents_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocUpload'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Upload Document Knowledge Documents Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Upload Document
      tags:
      - knowledge
  /knowledge/search:
    post:
      operationId: search_knowledge_knowledge_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchQuery'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                title: Response Search Knowledge Knowledge Search Post
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Search Knowledge
      tags:
      - knowledge
  /plan:
    post:
      operationId: plan_endpoint_plan_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Plan Endpoint Plan Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Plan Endpoint
      tags:
      - planner
  /ready:
    get:
      operationId: ready_ready_get
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Ready Ready Get
          description: Successful Response
      summary: Ready
  /v1/sessions:
    post:
      operationId: create_session_endpoint_v1_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Session Endpoint
      tags:
      - sessions
  /v1/sessions/{session_id}:
    get:
      operationId: get_session_endpoint_v1_sessions__session_id__get
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          title: Session Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Get Session Endpoint
      tags:
      - sessions
  /v1/sessions/{session_id}/close:
    post:
      operationId: close_session_endpoint_v1_sessions__session_id__close_post
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          title: Session Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Close Session Endpoint V1 Sessions  Session Id  Close
                  Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Close Session Endpoint
      tags:
      - sessions
  /v1/sessions/{session_id}/invoke:
    post:
      operationId: invoke_v1_sessions__session_id__invoke_post
      parameters:
      - in: path
        name: session_id
        required: true
        schema:
          title: Session Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvokeRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvokeResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Invoke
      tags:
      - sessions
