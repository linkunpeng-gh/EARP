components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    SessionCreateRequest:
      properties:
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        role_id:
          minLength: 1
          title: Role Id
          type: string
        tenant_id:
          minLength: 1
          title: Tenant Id
          type: string
        user_id:
          minLength: 1
          title: User Id
          type: string
      required:
      - user_id
      - tenant_id
      - role_id
      title: SessionCreateRequest
      type: object
    SessionResponse:
      properties:
        session_id:
          title: Session Id
          type: string
        status:
          default: active
          title: Status
          type: string
        tenant_id:
          title: Tenant Id
          type: string
        user_id:
          title: User Id
          type: string
      required:
      - session_id
      - tenant_id
      - user_id
      title: SessionResponse
      type: object
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
info:
  title: EARP Server
  version: 0.1.0
openapi: 3.1.0
paths:
  /health:
    get:
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health Health Get
                type: object
          description: Successful Response
      summary: Health
  /ready:
    get:
      operationId: ready_ready_get
      responses:
        '200':
          content:
            application/json:
              schema:
                title: Response Ready Ready Get
          description: Successful Response
      summary: Ready
  /v1/sessions:
    post:
      description: 'Placeholder: contract locked in M0 (AC-08), implementation lands
        in M1.'
      operationId: create_session_v1_sessions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SessionCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Session
      tags:
      - sessions
