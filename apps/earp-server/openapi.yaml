info:
  title: EARP Server
  version: 0.1.0
openapi: 3.1.0
paths:
  /api/data-domains:
    get:
      operationId: list_data_domains_endpoint_api_data_domains_get
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                title: Response List Data Domains Endpoint Api Data Domains Get
                type: array
          description: Successful Response
      summary: List Data Domains Endpoint
      tags:
      - knowledge
    post:
      operationId: create_data_domain_endpoint_api_data_domains_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataDomainCreate'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Create Data Domain Endpoint Api Data Domains Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Data Domain Endpoint
      tags:
      - knowledge
  /api/data-domains/{data_domain_id}:
    delete:
      operationId: delete_data_domain_endpoint_api_data_domains__data_domain_id__delete
      parameters:
      - in: path
        name: data_domain_id
        required: true
        schema:
          title: Data Domain Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Delete Data Domain Endpoint Api Data Domains  Data
                  Domain Id  Delete
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Delete Data Domain Endpoint
      tags:
      - knowledge
    patch:
      description: Edit data domain basic attributes (name / description / classification
        / owner / routing).
      operationId: update_data_domain_endpoint_api_data_domains__data_domain_id__patch
      parameters:
      - in: path
        name: data_domain_id
        required: true
        schema:
          title: Data Domain Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataDomainUpdate'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Update Data Domain Endpoint Api Data Domains  Data
                  Domain Id  Patch
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Update Data Domain Endpoint
      tags:
      - knowledge
  /api/data-domains/{data_domain_id}/suggest-description:
    post:
      description: 'Generate a routing_description draft from the domain''s KB names/descriptions.


        Returns the draft + source KBs; the admin confirms/edits and saves via

        PATCH /api/data-domains/{id}. Management aid only — no test coverage

        for the LLM call itself (dev-only; Ollama required).'
      operationId: suggest_dd_description_endpoint_api_data_domains__data_domain_id__suggest_description_post
      parameters:
      - in: path
        name: data_domain_id
        required: true
        schema:
          title: Data Domain Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Suggest Dd Description Endpoint Api Data Domains  Data
                  Domain Id  Suggest Description Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Suggest Dd Description Endpoint
      tags:
      - knowledge
  /api/model-configs:
    get:
      operationId: list_model_configs_api_model_configs_get
      parameters:
      - in: query
        name: model_type
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Model Type
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  additionalProperties: true
                  type: object
                title: Response List Model Configs Api Model Configs Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: List Model Configs
      tags:
      - models
    post:
      operationId: create_model_config_api_model_configs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelConfigIn'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                additionalProperties: true
                title: Response Create Model Config Api Model Configs Post
                type: object
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      summary: Create Model Config
      tags:
      - models
  /api/model-configs/{config_id}:
    delete:
      operationId: delete_model_config_api_model_configs__config_id__delete
      parameters:
