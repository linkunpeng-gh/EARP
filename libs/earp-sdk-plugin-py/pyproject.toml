[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earp-sdk-plugin"
version = "0.1.0.dev0"
description = "EARP Plugin SDK"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "EARP Team" }]
dependencies = ["earp-sdk-core>=0.1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.hatch.build.targets.wheel]
packages = ["src/earp_sdk_plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
