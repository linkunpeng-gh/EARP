    layer: platform
    version: null
    content_hash: null
  - pack_id: coal-mining-industry
    layer: industry
    version: null
    content_hash: null
  - pack_id: jqmk-enterprise
    layer: enterprise
    version: null
    content_hash: null

# 可配置角色列表（不硬编码角色数量和名称，一人可兼任多角色）
roles:
