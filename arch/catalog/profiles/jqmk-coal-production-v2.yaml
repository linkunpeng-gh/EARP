    name: 林鲲鹏
    team: EARP 项目
    contact: null
  - role_key: platform_architect
    name: 隋昕航
    team: EARP 项目
    contact: null
  - role_key: data_domain_owner
    name: 隋昕航
    team: EARP 项目
    contact: null
