# EARP Catalog Profile v2 —— 项目级配置（值层）
# schema: catalog-profile/v2 —— 一 Profile 一 domain，roles 可配置数组，backup_approver 必填
# 禁止加入 allow_inactive / disable_fail_closed 等语义开关
# 本文件为 Phase 1 开发使用的 v2 配置，r1 签署实例仍绑定 v1（jqmk-coal-production.yaml）
profile_id: jqmk-coal-production
schema_version: catalog-profile/v2
template_contract_version: n01a-catalog-phase0-signoff/v1

# scope（仅值，不定义语义）
industry_scope: coal_mining
enterprise_scope: SDRH
tenant_id: JQMK
data_domain: production

catalog_profile_id: coal.sdrh.jqmk.production

# pack_lock：pack 尚未形成，version/hash 待填（null=待签署，对应 D-13）
pack_lock:
